# Paid web service + persistent disk. Review Render's estimate before deploying.
services:
  - type: web
    name: cs-arena
    runtime: node
    plan: 0.5c-512mb
    region: virginia
    branch: main
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    disk:
      name: arena-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_PASSWORD
        sync: false
